bio: |
  I am a lecturer in the Department of Information Management at North China University of Water Resources and Electric Power. I received my PhD in Management Science and Engineering from Nanjing University of Aeronautics and Astronautics and spent one year at Simon Fraser University as a visiting doctoral student.

  My research focuses on forecasting and decision-making, grey systems theory, and inventory management. I develop grey forecasting models for seasonal time series and deteriorating inventory systems. I serve on the editorial board of The Journal of Grey System and as a youth council member of the Operations Research Society of Henan Province.
